<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f293d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 44px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f1f5f9; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #94a3b8; line-height: 1.4; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#dropGlow)" />
  <circle cx="1000" cy="340" r="160" fill="#a855f7" opacity="0.08" filter="url(#dropGlow)" />

  <!-- Header Section -->
  <g transform="translate(60, 55)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="12" cy="13" r="5" fill="#10b981" />
    <text x="26" y="17" class="badge-text" fill="#38bdf8">AUTONOMOUS QA AGENT</text>

    <!-- Project Title -->
    <text x="0" y="65" class="title">UI QA Tester <tspan fill="#38bdf8">🎯</tspan></text>
    
    <!-- Subtitle -->
    <text x="0" y="100" class="subtitle">Autonomous, Non-Intrusive Windows Desktop &amp; Hardware-in-the-Loop QA</text>
    <text x="0" y="125" class="subtitle" font-size="15px" fill="#64748b">Multimodal AI Vision (Gemini / Local VLMs) • Background Win32/UIA Actuation • Real-Time Hardware Telemetry</text>
  </g>

  <!-- Feature Grid (4 Pillars) -->
  <g transform="translate(60, 220)">
    <!-- Pillar 1: Non-Intrusive Background Testing -->
    <g transform="translate(0, 0)">
      <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="16" width="32" height="32" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="26" y="38" font-size="16">🛡️</text>
      <text x="58" y="37" class="card-title">Zero Focus Stealing</text>
      <text x="18" y="72" class="card-desc">100% background testing via</text>
      <text x="18" y="90" class="card-desc">PrintWindow + PostMessageW.</text>
      <text x="18" y="108" class="card-desc">Never hijacks physical cursor.</text>
      <rect x="18" y="124" width="95" height="18" rx="9" fill="#1e293b" />
      <text x="26" y="136" font-family="sans-serif" font-size="10px" font-weight="600" fill="#38bdf8">p95 ≤ 50ms</text>
    </g>

    <!-- Pillar 2: Hardware-in-the-Loop Telemetry -->
    <g transform="translate(275, 0)">
      <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="16" width="32" height="32" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="26" y="38" font-size="16">⚡</text>
      <text x="58" y="37" class="card-title">Hardware Telemetry</text>
      <text x="18" y="72" class="card-desc">Correlates UI clicks with serial,</text>
      <text x="18" y="90" class="card-desc">USB, MCU logs &amp; CPU/RAM health.</text>
      <text x="18" y="108" class="card-desc">Catches silent NACKs &amp; hangs.</text>
      <rect x="18" y="124" width="115" height="18" rx="9" fill="#1e293b" />
      <text x="26" y="136" font-family="sans-serif" font-size="10px" font-weight="600" fill="#10b981">[-50ms, +1500ms]</text>
    </g>

    <!-- Pillar 3: Multimodal AI Vision Critic -->
    <g transform="translate(550, 0)">
      <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="16" width="32" height="32" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" />
      <text x="26" y="38" font-size="16">🧠</text>
      <text x="58" y="37" class="card-title">Multimodal AI Critic</text>
      <text x="18" y="72" class="card-desc">Gemini API &amp; local VLMs</text>
      <text x="18" y="90" class="card-desc">critique layout, contrast, clipping</text>
      <text x="18" y="108" class="card-desc">&amp; missing a11y labels.</text>
      <rect x="18" y="124" width="125" height="18" rx="9" fill="#1e293b" />
      <text x="26" y="136" font-family="sans-serif" font-size="10px" font-weight="600" fill="#c084fc">Gemini 2.5 + Ollama</text>
    </g>

    <!-- Pillar 4: Agent-Ready Loop & Replay -->
    <g transform="translate(825, 0)">
      <rect width="255" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="16" width="32" height="32" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" />
      <text x="26" y="38" font-size="16">🤖</text>
      <text x="58" y="37" class="card-title">AI Agent Feedback</text>
      <text x="18" y="72" class="card-desc">Exports agent fix prompts,</text>
      <text x="18" y="90" class="card-desc">GitHub Issues &amp; action traces.</text>
      <text x="18" y="108" class="card-desc">Deterministic replay on demand.</text>
      <rect x="18" y="124" width="135" height="18" rx="9" fill="#1e293b" />
      <text x="26" y="136" font-family="sans-serif" font-size="10px" font-weight="600" fill="#fbbf24">action-trace.json</text>
    </g>
  </g>
</svg>
